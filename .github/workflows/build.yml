name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tools/**'
      - 'site/**'
      - 'scripts/site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Prepare web app (fonts, runtime, version)
        run: node scripts/prepare-web.mjs

      - name: Create Android project
        run: npx cap add android

      - name: Customize Android project
        run: bash scripts/patch-android.sh

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Signing key
        id: key
        env:
          TFILATI_KEY_PASS: ${{ secrets.TFILATI_KEY_PASS }}
        run: |
          if [ -z "$TFILATI_KEY_PASS" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret TFILATI_KEY_PASS is missing, building a test APK only"
          else
            cp signing/release.jks android/app/release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          TFILATI_STORE_PASSWORD: ${{ secrets.TFILATI_KEY_PASS }}
          TFILATI_KEY_PASSWORD: ${{ secrets.TFILATI_KEY_PASS }}
          TFILATI_KEY_ALIAS: tfilati
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../tfilati.apk
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../tfilati.apk
          fi

      - name: Verify APK
        run: |
          ls -la tfilati.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs tfilati.apk | head -5 || true
          "$BT/aapt" dump badging tfilati.apk 2>/dev/null | grep -E "package|sdkVersion|targetSdk|application-label" | head -6 || true

      - name: Publish release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APP_VERSION}"
          WHATS_NEW=""
          if [ -s release-notes.txt ]; then WHATS_NEW=$'\n\nמה חדש:\n'"$(sed '/^\s*$/d; s/^/• /' release-notes.txt)"; fi
          NOTES=$'תפילתי — גרסה '"${APP_VERSION}${WHATS_NEW}"$'\n\nלהתקנה: הורידו את tfilati.apk בטלפון ופתחו אותו. בהתקנה הראשונה יש לאשר "התקנה ממקור לא ידוע".\nעדכון: מתקינים את הקובץ החדש מעל הקיים. הנתונים נשמרים.\nהאתר עם הסבר לכל כפתור: https://luach-sport.github.io/tfilati/'
          gh release create "$TAG" tfilati.apk --title "תפילתי ${APP_VERSION}" --notes "$NOTES" --latest

      - name: Refresh the website (new version number and what's new)
        if: steps.key.outputs.signed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run site.yml --ref main -R "${GITHUB_REPOSITORY}"

      - name: Missing signing password
        if: steps.key.outputs.signed != 'true'
        run: |
          echo "::error::Test build passed, but the APK was not published: add the secret TFILATI_KEY_PASS"
          exit 1

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Prepare web app (fonts, runtime, version)
        run: node scripts/prepare-web.mjs

      - name: Upload web version for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Create Android project
        run: npx cap add android

      - name: Customize Android project
        run: bash scripts/patch-android.sh

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Signing key
        env:
          TFILATI_KEY_PASS: ${{ secrets.TFILATI_KEY_PASS }}
        run: |
          if [ -z "$TFILATI_KEY_PASS" ]; then echo "::error::Missing secret TFILATI_KEY_PASS (Settings > Secrets and variables > Actions)"; exit 1; fi
          cp signing/release.jks android/app/release.jks

      - name: Build signed APK
        working-directory: android
        env:
          TFILATI_STORE_PASSWORD: ${{ secrets.TFILATI_KEY_PASS }}
          TFILATI_KEY_PASSWORD: ${{ secrets.TFILATI_KEY_PASS }}
          TFILATI_KEY_ALIAS: tfilati
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5 || true
          "$BT/aapt" dump badging "$APK" 2>/dev/null | grep -E "package|sdkVersion|targetSdk|application-label" | head -6 || true
          cp "$APK" tfilati.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APP_VERSION}"
          NOTES=$'תפילתי — גרסה '"${APP_VERSION}"$'\n\nלהתקנה: הורידו את tfilati.apk בטלפון ופתחו אותו. בהתקנה הראשונה יש לאשר "התקנה ממקור לא ידוע".\nעדכון: מתקינים את הקובץ החדש מעל הקיים. הנתונים נשמרים.'
          gh release create "$TAG" tfilati.apk --title "תפילתי ${APP_VERSION}" --notes "$NOTES" --latest

  pages:
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
